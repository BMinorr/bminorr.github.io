<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discography — Andy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#17120e;
    --ink-dim:rgba(23,18,14,0.62);
    --sky-fallback:#b7b7b7;
    --surface-2:#2c221a;
    --paper:#f3e9da;
    --paper-dim:#c7b6a1;
    --copper:#e08a45;
    --line:rgba(243,233,218,0.14);
    --glass:rgba(14,11,8,0.62);
    --glass-hover:rgba(14,11,8,0.74);
    --glass-border:rgba(243,233,218,0.2);
  }

  html{ overscroll-behavior:none; }
  *{box-sizing:border-box;}
  img{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  body{
    background:var(--sky-fallback);
    color:var(--ink);
    font-family:'Archivo',-apple-system,'Helvetica Neue',Arial,sans-serif;
    margin:0;
    padding:0;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
  }

  .sky-bg{
    position:fixed;
    inset:-30px;
    z-index:-1;
    background-image:url(../../covers/sky.jpg);
    background-size:cover;
    background-position:center;
    filter:grayscale(1) blur(6px);
  }

  .stage{
    position:relative;
    min-height:100vh;
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 48px;
    overflow-x:hidden;
  }
  @media (min-width:700px){
    .stage{ zoom:1.25; }
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:900;
    font-size:clamp(38px, 10vw, 50px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 48px;
    text-wrap:balance;
    text-align:center;
  }

  .disco-grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:10px;
    margin-bottom:36px;
  }
  .disco-card{
    display:block;
    padding:8px;
    border-radius:14px;
    text-decoration:none;
    color:var(--paper);
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:0 1px 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
    transition:background .18s ease;
  }
  .disco-card:active,
  .disco-card:focus-visible{
    background:var(--glass-hover);
  }
  .disco-art{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:9px;
    overflow:hidden;
  }
  .disco-art img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .disco-caption{
    display:block;
    margin-top:8px;
    overflow:hidden;
    white-space:nowrap;
    font-family:'Archivo',sans-serif;
    font-weight:600;
    font-size:12px;
    line-height:1.25;
  }
  .marquee-track{ display:inline-flex; }
  .marquee-copy{ white-space:nowrap; padding-right:32px; }
  .disco-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:3px;
    font-family:'IBM Plex Mono',monospace;
    font-size:8.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--paper-dim);
    white-space:nowrap;
  }
  .disco-meta-left{
    display:flex;
    align-items:center;
    gap:3px;
  }
  .disco-explicit{
    display:flex;
    align-items:center;
    justify-content:center;
    width:11px;
    height:11px;
    flex:none;
    border:1px solid var(--paper-dim);
    border-radius:3px;
    font-size:7px;
    line-height:1;
    color:var(--paper-dim);
  }

  footer{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    color:var(--ink-dim);
  }
  .back-link{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    text-decoration:none;
    border-bottom:1px solid var(--ink-dim);
    padding-bottom:1px;
  }
  footer p{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.08em;
    line-height:1.7;
    text-align:center;
    margin:0;
  }

  @media (hover: hover) and (pointer: fine){
    .disco-card:hover{
      background:var(--glass-hover);
    }
  }
</style>
</head>
<body oncontextmenu="return false">

<div class="sky-bg"></div>

<div class="stage">
  <div class="page">

    <h1>Discography</h1>

    <div class="disco-grid">
      <a class="disco-card" href="../ochii-pe-mine/">
        <div class="disco-art">
          <img src="../../covers/card/nu-fac-nimic-square.jpg" alt="Ochii pe mine cover art">
        </div>
        <span class="disco-caption">Ochii pe mine</span>
        <span class="disco-meta"><span class="disco-meta-left"><span class="disco-explicit">E</span>Album</span><span class="disco-meta-year">2026</span></span>
      </a>
    </div>

    <footer>
      <a class="back-link" href="../">← Back to Andy</a>
      <p>© 2026 ANDY<br>ALL RIGHTS RESERVED</p>
    </footer>

  </div>
</div>

<script>
(function(){
  function setupMarquee(el){
    if (el.dataset.marqueeReady) return;
    var text = el.textContent;
    el.textContent = '';
    var track = document.createElement('span');
    track.className = 'marquee-track';
    var copy1 = document.createElement('span');
    copy1.className = 'marquee-copy';
    copy1.textContent = text;
    track.appendChild(copy1);
    el.appendChild(track);
    el.dataset.marqueeReady = '1';
  }
  var marqueeCounter = 0;
  function measureMarquee(el){
    var track = el.querySelector('.marquee-track');
    var copy1 = el.querySelector('.marquee-copy');
    if(!track || !copy1) return;
    var extra = track.querySelectorAll('.marquee-copy');
    for(var i = 1; i < extra.length; i++) extra[i].remove();
    track.style.animation = 'none';
    if(track._marqueeStyleTag){ track._marqueeStyleTag.remove(); track._marqueeStyleTag = null; }
    var copyPadding = parseFloat(getComputedStyle(copy1).paddingRight) || 0;
    var overflow = (copy1.scrollWidth - copyPadding) - el.clientWidth;
    if(overflow > 2){
      var copy2 = copy1.cloneNode(true);
      track.appendChild(copy2);
      var scrollSeconds = Math.max(4, 3 + overflow / 18);
      var pauseSeconds = 3;
      var total = scrollSeconds + pauseSeconds;
      var pausePct = (scrollSeconds / total) * 100;
      var animName = 'marquee-anim-' + (marqueeCounter++);
      var styleTag = document.createElement('style');
      styleTag.textContent = '@keyframes ' + animName + '{' +
        '0%{transform:translateX(0);}' +
        pausePct.toFixed(3) + '%{transform:translateX(-50%);}' +
        '100%{transform:translateX(-50%);}' +
      '}';
      document.head.appendChild(styleTag);
      track._marqueeStyleTag = styleTag;
      track.style.animation = animName + ' ' + total + 's linear infinite';
    }
  }
  document.querySelectorAll('.disco-caption').forEach(function(el){
    setupMarquee(el);
    measureMarquee(el);
  });
})();
</script>
</body>
</html>
