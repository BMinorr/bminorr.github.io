<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHUKAR w/ Florinswag, txfu! & Alin Jr — skyari!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#17120e;
    --ink-dim:rgba(23,18,14,0.62);
    --sky-fallback:#b7b7b7;
    --surface-2:#2c221a;
    --paper:#f3e9da;
    --paper-dim:#c7b6a1;
    --copper:#e08a45;
    --line:rgba(243,233,218,0.14);
    --glass:rgba(14,11,8,0.62);
    --glass-hover:rgba(14,11,8,0.74);
    --glass-border:rgba(243,233,218,0.2);
    --h1-font:'Fraunces',Georgia,serif;
    --bg-image:url(../../covers/bg/gone-square.jpg);
    --bg-color:var(--sky-fallback);
  }

  html{ overscroll-behavior:none; }
  *{box-sizing:border-box;}
  img{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  body{
    background:var(--sky-fallback);
    color:var(--ink);
    font-family:'Archivo',-apple-system,'Helvetica Neue',Arial,sans-serif;
    margin:0;
    padding:0;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
  }

  .sky-bg{
    position:fixed;
    inset:-30px;
    z-index:-1;
    background-image:var(--bg-image);
    background-color:var(--bg-color);
    background-size:cover;
    background-position:center;
    filter:blur(45px) brightness(0.75);
  }

  .stage{
    position:relative;
    min-height:100vh;
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 20px 48px;
    overflow-x:hidden;
  }
  @media (min-width:700px){
    .stage{ zoom:1.25; }
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .cover{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:28px;
    background:linear-gradient(150deg, var(--surface-2), var(--ink));
    box-shadow:0 12px 32px rgba(0,0,0,0.28);
  }
  .cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  h1{
    font-family:var(--h1-font);
    font-weight:900;
    font-size:clamp(38px, 10vw, 50px);
    line-height:1.05;
    letter-spacing:-0.01em;
    color:var(--paper);
    margin:0 0 6px;
    text-wrap:balance;
    text-align:center;
  }
  .feat-line{
    font-family:var(--h1-font);
    font-weight:700;
    font-size:20px;
    color:var(--paper-dim);
    text-align:center;
    margin:0 0 36px;
  }

  .section-label{
    display:flex;
    justify-content:center;
    width:100%;
    margin-bottom:14px;
  }
  .section-label span{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--paper);
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:36px;
  }

  .link-row{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:14px;
    color:var(--paper);
    text-decoration:none;
    font-family:'Archivo',sans-serif;
    font-weight:600;
    font-size:16px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:0 1px 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
    transition:background .18s ease;
  }
  .link-row:active, .link-row:focus-visible{
    background:var(--glass-hover);
  }
  .link-row:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .link-row.is-unavailable{
    opacity:0.45;
    cursor:default;
  }
  .link-unavailable{
    flex:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
    color:var(--paper-dim);
    white-space:nowrap;
  }

  .link-icon{
    width:38px;
    height:38px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    overflow:hidden;
  }
  .link-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .link-label{ flex:1; }

  .link-arrow{
    flex:none;
    color:var(--paper-dim);
  }

  .feat-link{
    color:var(--paper);
    text-decoration:underline;
    text-decoration-color:var(--paper-dim);
    text-underline-offset:6px;
  }

  .about-card{
    width:100%;
    padding:18px;
    border-radius:14px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:0 1px 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
    margin-bottom:36px;
  }
  .about-row{
    font-family:'Archivo',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--paper);
    text-align:left;
  }

  footer{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    color:var(--paper);
  }
  .back-link{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--paper);
    text-decoration:none;
    border-bottom:1px solid var(--paper-dim);
    padding-bottom:1px;
  }
  footer p{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.08em;
    line-height:1.7;
    text-align:center;
    margin:0;
  }

  @media (max-width:380px){
    .link-row{ padding:14px 14px; font-size:15px; }
  }

  @media (hover: hover) and (pointer: fine){
    .link-row:hover{
      background:var(--glass-hover);
    }
  }

  body.light-cover h1{ color:var(--ink); }
  body.light-cover .feat-line{ color:var(--ink-dim); }
  body.light-cover .feat-link{ color:var(--ink); text-decoration-color:var(--ink-dim); }
  body.light-cover .section-label span{ color:var(--ink-dim); }
  body.light-cover footer{ color:var(--ink-dim); }
  body.light-cover .back-link{ color:var(--ink-dim); border-bottom-color:var(--ink-dim); }
</style>
</head>
<body oncontextmenu="return false" data-artists="florinswag" data-features="skyari,txfu,alin-jr">

<div class="sky-bg"></div>

<div class="stage">
  <div class="page">

    <div class="cover">
      <img src="../../covers/gone-square.jpg" alt="SHUKAR cover art">
    </div>

    <h1>SHUKAR</h1>
    <p class="feat-line">w/ <a class="feat-link" href="../../florinswag/">Florinswag</a>, <a class="feat-link" href="../../txfu/">txfu!</a> &amp; <a class="feat-link" href="../../alin-jr/">Alin Jr</a></p>

    <div class="section-label"><span>Listen</span></div>
    <div class="links">
      <a class="link-row" href="https://open.spotify.com/track/5pOAklMfb5HKLhohfBjLES" target="_blank" rel="noopener">
        <span class="link-icon" aria-hidden="true">
          <img src="../../covers/icons/spotify.webp" alt="">
        </span>
        <span class="link-label">Spotify</span>
        <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>

      <a class="link-row" href="https://music.apple.com/us/song/shukar/6800316848" target="_blank" rel="noopener">
        <span class="link-icon" aria-hidden="true">
          <img src="../../covers/icons/apple-music.webp" alt="">
        </span>
        <span class="link-label">Apple Music</span>
        <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>

      <a class="link-row" href="https://music.youtube.com/watch?v=mqXaKwRxvSQ" target="_blank" rel="noopener">
        <span class="link-icon" aria-hidden="true">
          <img src="../../covers/icons/youtube-music.webp" alt="">
        </span>
        <span class="link-label">YouTube Music</span>
        <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>

      <a class="link-row" href="https://youtu.be/mqXaKwRxvSQ" target="_blank" rel="noopener">
        <span class="link-icon" aria-hidden="true">
          <img src="../../covers/icons/youtube.webp" alt="">
        </span>
        <span class="link-label">YouTube</span>
        <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
    </div>

    <div class="section-label"><span>About</span></div>
    <div class="about-card">
      <div class="about-row">Released on 14.08.2026</div>
      <div class="about-row">Genre: Trap</div>
    </div>

    <footer>
      <a class="back-link" href="../">← Back to skyari!</a>
      <p>© 2026 SKYARI!<br>ALL RIGHTS RESERVED</p>
    </footer>

  </div>
</div>


<script>
(function(){
  var bg = getComputedStyle(document.querySelector('.sky-bg')).backgroundImage;
  var m = bg.match(/url\(["\']?(.*?)["\']?\)/);
  if(!m) return;
  var img = new Image();
  img.onload = function(){
    var w = 24, h = 24;
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    try{
      var data = ctx.getImageData(0, 0, w, h).data;
      var sum = 0, count = 0;
      for(var i=0; i<data.length; i+=4){
        sum += 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
        count++;
      }
      if ((sum/count) > 180) document.body.classList.add('light-cover');
    }catch(e){}
  };
  img.src = m[1];
})();
</script>
</body>
</html>
