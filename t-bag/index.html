<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T Bag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#17120e;
    --ink-dim:rgba(23,18,14,0.62);
    --sky-fallback:#b7b7b7;
    --surface-2:#2c221a;
    --paper:#f3e9da;
    --paper-dim:#c7b6a1;
    --copper:#e08a45;
    --ember:#c34f3c;
    --line:rgba(243,233,218,0.14);
    --glass:rgba(14,11,8,0.62);
    --glass-hover:rgba(14,11,8,0.74);
    --glass-border:rgba(243,233,218,0.2);
    --bg-image:url(../covers/t-bag-profile.jpg);
    --bg-color:var(--sky-fallback);
  }

  html{
    overscroll-behavior:none;
  }
  *{box-sizing:border-box;}
  img{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  body{
    background:var(--sky-fallback);
    color:var(--ink);
    font-family:'Archivo',-apple-system,'Helvetica Neue',Arial,sans-serif;
    margin:0;
    padding:0;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
  }

  .sky-bg{
    position:fixed;
    inset:-30px;
    z-index:-1;
    background-image:var(--bg-image);
    background-color:var(--bg-color);
    background-size:cover;
    background-position:center;
    filter:blur(45px) brightness(0.75);
  }

  .stage{
    position:relative;
    min-height:100vh;
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 20px 48px;
    overflow-x:hidden;
  }
  @media (min-width:700px){
    .stage{ zoom:1.25; }
  }

  .hero-wrap{
    width:100%;
    max-width:1400px;
    margin:0 auto;
  }
  .hero-photo{
    position:relative;
    z-index:1;
    width:100%;
    height:0;
    padding-top:clamp(44.44%, calc(100% - 55.56% * (100vw - 480px) / 920px), 100%);
    margin-bottom:0;
    overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom, black 78%, transparent 100%);
    mask-image:linear-gradient(to bottom, black 78%, transparent 100%);
  }
  @media (min-width:700px){
    .hero-photo{
      -webkit-mask-image:linear-gradient(to bottom, black 78%, transparent 100%), linear-gradient(to right, transparent 0, black 120px), linear-gradient(to left, transparent 0, black 120px);
      -webkit-mask-composite:source-in, source-in;
      mask-image:linear-gradient(to bottom, black 78%, transparent 100%), linear-gradient(to right, transparent 0, black 120px), linear-gradient(to left, transparent 0, black 120px);
      mask-composite:intersect;
    }
  }
  .hero-photo img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:900;
    font-size:clamp(52px, 15vw, 72px);
    line-height:1;
    letter-spacing:-0.01em;
    margin:0 0 12px;
    text-wrap:balance;
    text-align:center;
  }

  .tagline{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 36px;
    text-align:center;
  }

  /* ---- section groups ---- */
  .group{
    width:100%;
    margin-bottom:32px;
  }
  .section-label{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  .section-label span{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  /* ---- liquid glass surface, shared by every card/button ---- */
  .spotlight-featured,
  .spotlight-card,
  .link-row,
  .see-all-btn{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:0 1px 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  /* ---- spotlight: latest release ---- */
  .spotlight-featured{
    display:block;
    width:100%;
    padding:12px;
    border-radius:18px;
    text-decoration:none;
    color:var(--paper);
    margin-bottom:16px;
    transition:background .18s ease;
  }
  .spotlight-featured:active,
  .spotlight-featured:focus-visible{
    background:var(--glass-hover);
  }
  .spotlight-featured-art{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:12px;
    background:var(--tint, linear-gradient(150deg, var(--surface-2), var(--ink)));
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .spotlight-featured-art img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .spotlight-featured .spotlight-title-row{ margin-top:14px; }
  .spotlight-featured-caption{
    display:block;
    margin:0;
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:19px;
    line-height:1.3;
  }

  .release-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:3px 2px 0;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--paper-dim);
    white-space:nowrap;
  }
  .meta-left{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .explicit-tag{
    display:flex;
    align-items:center;
    justify-content:center;
    width:14px;
    height:14px;
    flex:none;
    border:1px solid var(--paper-dim);
    border-radius:3px;
    font-size:9px;
    letter-spacing:0;
  }

  /* ---- spotlight: 3 most recent ---- */
  .spotlight-grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:12px;
    margin-bottom:16px;
  }

  .see-all-btn{
    display:flex;
    flex-direction:column;
    width:100%;
    padding:15px 18px;
    border-radius:14px;
    text-decoration:none;
    color:var(--paper);
    transition:background .18s ease;
    overflow:hidden;
  }
  .see-all-btn:active, .see-all-btn:focus-visible{
    background:var(--glass-hover);
  }
  .see-all-covers{
    width:100%;
    height:32px;
    overflow:hidden;
    margin-bottom:10px;
    -webkit-mask-image:linear-gradient(to right, transparent, black 12%, black 88%, transparent);
    mask-image:linear-gradient(to right, transparent, black 12%, black 88%, transparent);
  }
  .see-all-covers-track{
    display:flex;
    align-items:center;
    gap:6px;
    width:max-content;
  }
  .see-all-covers-track img{
    width:32px;
    height:32px;
    border-radius:7px;
    object-fit:cover;
    display:block;
    flex:none;
  }
  .see-all-label{
    display:block;
    width:100%;
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
  }

  .spotlight-card{
    padding:9px;
    border-radius:15px;
    text-decoration:none;
    color:var(--paper);
    transition:background .18s ease;
  }
  .spotlight-card:active,
  .spotlight-card:focus-visible{
    background:var(--glass-hover);
  }
  .spotlight-art{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:10px;
    background:var(--tint, linear-gradient(150deg, var(--surface-2), var(--ink)));
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .spotlight-art img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .spotlight-card .spotlight-title-row{ margin-top:9px; }
  .spotlight-card .release-meta{ font-size:8px; letter-spacing:0.02em; }
  .spotlight-card .explicit-tag{ width:11px; height:11px; font-size:7px; }
  .spotlight-title-row{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
  }
  .spotlight-caption{
    display:block;
    flex:1;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    font-family:'Archivo',sans-serif;
    font-weight:600;
    font-size:13.5px;
    line-height:1.3;
  }
  .marquee-track{ display:inline-flex; }
  .marquee-copy{ white-space:nowrap; padding-right:32px; }

  /* ---- links (streaming + socials) ---- */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .link-row{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:14px;
    color:var(--paper);
    text-decoration:none;
    font-family:'Archivo',sans-serif;
    font-weight:600;
    font-size:16px;
    transition:background .18s ease;
  }
  .link-row:active, .link-row:focus-visible{
    background:var(--glass-hover);
  }
  .link-row:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .link-row.is-unavailable{
    opacity:0.45;
    cursor:default;
  }
  .link-unavailable{
    flex:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
    color:var(--paper-dim);
    white-space:nowrap;
  }

  .link-icon{
    width:38px;
    height:38px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    overflow:hidden;
  }
  .link-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .link-label{ flex:1; }

  .link-arrow{
    flex:none;
    color:var(--paper-dim);
  }

  footer{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    color:var(--ink-dim);
  }
  footer p{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.08em;
    line-height:1.7;
    text-align:center;
    margin:0;
  }

  @media (max-width:380px){
    .link-row{ padding:14px 14px; font-size:15px; }
  }

  @media (hover: hover) and (pointer: fine){
    .spotlight-featured:hover,
    .spotlight-card:hover,
    .link-row:hover,
    .see-all-btn:hover{
      background:var(--glass-hover);
    }
  }
</style>
</head>
<body oncontextmenu="return false" data-artist="t-bag">

<div class="sky-bg"></div>

<div class="hero-wrap">

<div class="stage">

<script>
(function(){
  function setupMarquee(el){
    if (el.dataset.marqueeReady) return;
    var text = el.textContent;
    el.textContent = '';
    var track = document.createElement('span');
    track.className = 'marquee-track';
    var copy1 = document.createElement('span');
    copy1.className = 'marquee-copy';
    copy1.textContent = text;
    track.appendChild(copy1);
    el.appendChild(track);
    el.dataset.marqueeReady = '1';
  }
  var marqueeCounter = 0;
  function measureMarquee(el){
    var track = el.querySelector('.marquee-track');
    var copy1 = el.querySelector('.marquee-copy');
    if(!track || !copy1) return;
    var extra = track.querySelectorAll('.marquee-copy');
    for(var i = 1; i < extra.length; i++) extra[i].remove();
    el.classList.remove('marquee');
    track.style.animation = 'none';
    if(track._marqueeStyleTag){ track._marqueeStyleTag.remove(); track._marqueeStyleTag = null; }
    var copyPadding = parseFloat(getComputedStyle(copy1).paddingRight) || 0;
    var overflow = (copy1.scrollWidth - copyPadding) - el.clientWidth;
    if(overflow > 2){
      var copy2 = copy1.cloneNode(true);
      track.appendChild(copy2);
      var scrollSeconds = Math.max(4, 3 + overflow / 18);
      var pauseSeconds = 3;
      var total = scrollSeconds + pauseSeconds;
      var pausePct = (scrollSeconds / total) * 100;
      var animName = 'marquee-anim-' + (marqueeCounter++);
      var styleTag = document.createElement('style');
      styleTag.textContent = '@keyframes ' + animName + '{' +
        '0%{transform:translateX(0);}' +
        pausePct.toFixed(3) + '%{transform:translateX(-50%);}' +
        '100%{transform:translateX(-50%);}' +
      '}';
      document.head.appendChild(styleTag);
      track._marqueeStyleTag = styleTag;
      track.style.animation = animName + ' ' + total + 's linear infinite';
      el.classList.add('marquee');
    }
  }
  var tickerCounter = 0;
  function setupCoverTicker(container){
    var track = container.querySelector('.see-all-covers-track');
    if(!track) return;
    if(!track._baseImgs){
      track._baseImgs = Array.prototype.slice.call(track.children);
    }
    while(track.children.length > track._baseImgs.length) track.removeChild(track.lastChild);
    if(track._tickerStyleTag){ track._tickerStyleTag.remove(); track._tickerStyleTag = null; }
    var gap = parseFloat(getComputedStyle(track).gap) || 0;
    var baseWidth = 0;
    track._baseImgs.forEach(function(img){ baseWidth += img.getBoundingClientRect().width + gap; });
    if(baseWidth <= 0) return;
    var containerWidth = container.clientWidth;
    var copies = Math.max(2, Math.ceil((containerWidth * 2) / baseWidth));
    for(var c = 1; c < copies; c++){
      track._baseImgs.forEach(function(img){ track.appendChild(img.cloneNode(true)); });
    }
    var pxPerSecond = 19;
    var seconds = baseWidth / pxPerSecond;
    var pct = 100 / copies;
    var animName = 'covers-scroll-dyn-' + (tickerCounter++);
    var styleTag = document.createElement('style');
    styleTag.textContent = '@keyframes ' + animName + '{ from{transform:translateX(0);} to{transform:translateX(-' + pct.toFixed(4) + '%);} }';
    document.head.appendChild(styleTag);
    track._tickerStyleTag = styleTag;
    track.style.animation = animName + ' ' + seconds.toFixed(2) + 's linear infinite';
  }
  function refresh(){
    document.querySelectorAll('.spotlight-caption').forEach(function(el){
      setupMarquee(el);
      measureMarquee(el);
    });
    document.querySelectorAll('.see-all-covers').forEach(setupCoverTicker);
  }
  refresh();
  var lastWidth = window.innerWidth;
  window.addEventListener('resize', function(){
    if(window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    refresh();
  });
})();
</script>
</body>
</html>
