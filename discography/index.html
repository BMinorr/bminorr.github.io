<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discography — B Minor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#17120e;
    --ink-dim:rgba(23,18,14,0.62);
    --sky-fallback:#b7b7b7;
    --surface-2:#2c221a;
    --paper:#f3e9da;
    --paper-dim:#c7b6a1;
    --copper:#e08a45;
    --line:rgba(243,233,218,0.14);
    --glass:rgba(14,11,8,0.62);
    --glass-hover:rgba(14,11,8,0.74);
    --glass-border:rgba(243,233,218,0.2);
  }

  html{ overscroll-behavior-y:none; }
  *{box-sizing:border-box;}
  body{
    background:var(--sky-fallback);
    color:var(--ink);
    font-family:'Archivo',-apple-system,'Helvetica Neue',Arial,sans-serif;
    margin:0;
    padding:0;
    overscroll-behavior-y:none;
  }

  .sky-bg{
    position:fixed;
    inset:-30px;
    z-index:-1;
    background-image:url(../covers/sky.png);
    background-size:cover;
    background-position:center;
    filter:grayscale(1) blur(6px);
  }

  .stage{
    position:relative;
    min-height:100vh;
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 48px;
    overflow-x:hidden;
  }
  @media (min-width:700px){
    .stage{ zoom:1.25; }
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:900;
    font-size:clamp(38px, 10vw, 50px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 28px;
    text-wrap:balance;
    text-align:center;
  }

  .disco-grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:36px;
  }
  .disco-card{
    display:block;
    padding:8px;
    border-radius:14px;
    text-decoration:none;
    color:var(--paper);
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:0 1px 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
    transition:background .18s ease;
  }
  .disco-card:active,
  .disco-card:focus-visible{
    background:var(--glass-hover);
  }
  .disco-art{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:9px;
    overflow:hidden;
  }
  .disco-art img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .disco-caption{
    display:block;
    margin-top:8px;
    font-family:'Archivo',sans-serif;
    font-weight:600;
    font-size:12px;
    line-height:1.25;
  }
  .disco-meta{
    display:flex;
    align-items:center;
    gap:3px;
    margin-top:3px;
    font-family:'IBM Plex Mono',monospace;
    font-size:8.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--paper-dim);
    white-space:nowrap;
  }
  .disco-explicit{
    display:flex;
    align-items:center;
    justify-content:center;
    width:11px;
    height:11px;
    flex:none;
    border:1px solid var(--paper-dim);
    border-radius:3px;
    font-size:7px;
    color:var(--paper-dim);
  }

  /* ---- key signature chip ---- */
  .keychip{
    display:flex;
    align-items:center;
  }
  .keychip svg{ display:block; }

  footer{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    color:var(--ink-dim);
  }
  .back-link{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    text-decoration:none;
    border-bottom:1px solid var(--ink-dim);
    padding-bottom:1px;
  }
  footer p{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    line-height:1.7;
    text-align:center;
    margin:0;
  }
</style>
</head>
<body>

<div class="sky-bg"></div>

<div class="stage">
  <div class="page">

    <h1>Discography</h1>

    <div class="disco-grid">
      <a class="disco-card" href="../buze-pe-buze/" target="_blank" rel="noopener">
        <div class="disco-art">
          <img src="../covers/buze-pe-buze-square.png" alt="buze pe buze cover art">
        </div>
        <span class="disco-caption">buze pe buze</span>
        <span class="disco-meta">Single · 2026</span>
      </a>
      <a class="disco-card" href="../lately/" target="_blank" rel="noopener">
        <div class="disco-art">
          <img src="../covers/lately-square.png" alt="lately w/ Rosu cover art">
        </div>
        <span class="disco-caption">lately w/ Rosu</span>
        <span class="disco-meta">Single · 2026</span>
      </a>
      <a class="disco-card" href="../spection/" target="_blank" rel="noopener">
        <div class="disco-art">
          <img src="../covers/spection-w-cerb.jpeg" alt="'spection w/ Cerb cover art">
        </div>
        <span class="disco-caption">&#39;spection w/ Cerb</span>
        <span class="disco-meta"><span class="disco-explicit">E</span>Single · 2025</span>
      </a>
      <a class="disco-card" href="../contraste/" target="_blank" rel="noopener">
        <div class="disco-art">
          <img src="../covers/contraste-square.jpg" alt="contraste cover art">
        </div>
        <span class="disco-caption">contraste</span>
        <span class="disco-meta"><span class="disco-explicit">E</span>EP · 2024</span>
      </a>
      <a class="disco-card" href="../21-iunie/" target="_blank" rel="noopener">
        <div class="disco-art">
          <img src="../covers/21-iunie-square.jpg" alt="21 iunie cover art">
        </div>
        <span class="disco-caption">21 iunie</span>
        <span class="disco-meta"><span class="disco-explicit">E</span>Album · 2024</span>
      </a>
      <a class="disco-card" href="../cam-dor/" target="_blank" rel="noopener">
        <div class="disco-art">
          <img src="../covers/cam-dor-square.jpg" alt="cam dor cover art">
        </div>
        <span class="disco-caption">cam dor</span>
        <span class="disco-meta"><span class="disco-explicit">E</span>Single · 2023</span>
      </a>
      <a class="disco-card" href="../henny/" target="_blank" rel="noopener">
        <div class="disco-art">
          <img src="../covers/henny-square.jpg" alt="henny cover art">
        </div>
        <span class="disco-caption">henny</span>
        <span class="disco-meta">Single · 2022</span>
      </a>
      <a class="disco-card" href="../majora/" target="_blank" rel="noopener">
        <div class="disco-art">
          <img src="../covers/majora-square.jpg" alt="majora cover art">
        </div>
        <span class="disco-caption">majora</span>
        <span class="disco-meta">Single · 2021</span>
      </a>
    </div>

    <footer>
      <a class="back-link" href="../">← All links</a>
      <div class="keychip" aria-hidden="true">
        <svg width="46" height="22" viewBox="0 0 46 22" aria-hidden="true">
          <g stroke="var(--ink-dim)" stroke-width="1">
            <line x1="0" y1="3" x2="46" y2="3"/>
            <line x1="0" y1="7.5" x2="46" y2="7.5"/>
            <line x1="0" y1="12" x2="46" y2="12"/>
            <line x1="0" y1="16.5" x2="46" y2="16.5"/>
            <line x1="0" y1="21" x2="46" y2="21"/>
          </g>
          <text x="10" y="8" text-anchor="middle" font-size="13" fill="var(--paper)">♯</text>
          <text x="24" y="17" text-anchor="middle" font-size="13" fill="var(--paper)">♯</text>
        </svg>
      </div>
      <p>© 2026 B MINOR<br>ALL RIGHTS RESERVED</p>
    </footer>

  </div>
</div>

</body>
</html>
