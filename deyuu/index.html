<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deyuu</title>
<meta name="description" content="Deyuu. Latest releases and discography. Listen on Apple Music.">
<meta name="theme-color" content="#9b9da1">
<link rel="canonical" href="https://bminorr.github.io/deyuu/">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:site_name" content="B Minor">
<meta property="og:type" content="website">
<meta property="og:title" content="Deyuu">
<meta property="og:description" content="Deyuu. Latest releases and discography. Listen on Apple Music.">
<meta property="og:url" content="https://bminorr.github.io/deyuu/">
<meta property="og:image" content="https://bminorr.github.io/covers/gone-square.jpg">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
:root{
  --bg-image:url(/covers/generic-avatar.jpg);
}
</style>
</head>
<body class="page-artist light-cover" oncontextmenu="return false" data-artist="deyuu">

<div class="sky-bg"></div>

<div class="hero-wrap">
  <div class="hero-photo">
    <img src="../covers/generic-avatar.jpg" alt="Deyuu" fetchpriority="high" decoding="async">
  </div>
</div>

<div class="stage">
  <div class="page">

    <h1>Deyuu</h1>

    <section class="group">
      <div class="section-label"><span>Spotlight</span></div>

      <a class="spotlight-featured" href="caprisun/">
        <div class="spotlight-featured-art">
          <img src="../covers/card/gone-square.jpg" alt="CAPRISUN cover art">
        </div>
        <div class="spotlight-title-row">
          <span class="spotlight-featured-caption">CAPRISUN</span>
        </div>
        <span class="release-meta"><span class="meta-left"><span class="explicit-tag">E</span>Feature</span><span class="meta-year">2026</span></span>
      </a>
    </section>


    <section class="group">
      <div class="section-label"><span>Streaming</span></div>
      <div class="links">
        <div class="link-row is-unavailable">
          <span class="link-icon" aria-hidden="true">
            <img src="../covers/icons/spotify.webp" alt="">
          </span>
          <span class="link-label">Spotify</span>
          <span class="link-unavailable">(not available)</span>
        </div>

        <a class="link-row" href="https://music.apple.com/us/artist/deyuu/1564504429" target="_blank" rel="noopener">
          <span class="link-icon" aria-hidden="true">
            <img src="../covers/icons/apple-music.webp" alt="">
          </span>
          <span class="link-label">Apple Music</span>
          <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </a>

        <div class="link-row is-unavailable">
          <span class="link-icon" aria-hidden="true">
            <img src="../covers/icons/youtube-music.webp" alt="">
          </span>
          <span class="link-label">YouTube Music</span>
          <span class="link-unavailable">(not available)</span>
        </div>

        <div class="link-row is-unavailable">
          <span class="link-icon" aria-hidden="true">
            <img src="../covers/icons/youtube.webp" alt="">
          </span>
          <span class="link-label">YouTube</span>
          <span class="link-unavailable">(not available)</span>
        </div>
      </div>
    </section>

    <footer>
      <p>© 2026 DEYUU<br>ALL RIGHTS RESERVED</p>
    </footer>

  </div>
</div>

<script>
(function(){
  var el = document.querySelector('.sky-bg');
  if(!el) return;
  var forced = document.body.getAttribute('data-text');
  if(forced){
    document.body.classList.toggle('light-cover', forced === 'dark');
    document.body.classList.toggle('dark-cover', forced === 'light');
    return;
  }
  var cs = getComputedStyle(el);
  var m = cs.backgroundImage.match(/url\(["']?(.*?)["']?\)/);
  if(!m) return;
  var fm = cs.filter.match(/brightness\(([\d.]+)\)/);
  var k = fm ? parseFloat(fm[1]) : 1;
  var img = new Image();
  img.onload = function(){
    var w = 24, h = 24;
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    try{
      var data = ctx.getImageData(0, 0, w, h).data;
      var sum = 0, count = 0;
      for(var i=0; i<data.length; i+=4){
        sum += 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
        count++;
      }
      var bright = (sum/count) * k > 135;
      document.body.classList.toggle('light-cover', bright);
      document.body.classList.toggle('dark-cover', !bright);
    }catch(e){}
  };
  img.src = m[1];
})();
</script>
</body>
</html>
