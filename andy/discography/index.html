<div class="stage">

          </div>
          <span class="disco-caption">Ochii pe mine</span>
          <span class="disco-meta"><span class="disco-meta-left"><span class="disco-explicit">E</span>Album</span><span class="disco-meta-year">2026</span></span>
        </a>
      </div>
    </div>

    <div id="view-year" class="disco-view" hidden>
      <div class="disco-grid">
        <a class="disco-card" href="../ochii-pe-mine/">
          <div class="disco-art">
            <img src="../../covers/card/nu-fac-nimic-square.jpg" alt="Ochii pe mine cover art">
          </div>
          <span class="disco-caption">Ochii pe mine</span>
          <span class="disco-meta"><span class="disco-meta-left"><span class="disco-explicit">E</span>Album</span><span class="disco-meta-year">2026</span></span>
        </a>
      </div>
    </div>

    <div id="view-genre" class="disco-view" hidden>
      <div class="disco-grid">
        <a class="disco-card" href="../ochii-pe-mine/">
          <div class="disco-art">
            <img src="../../covers/card/nu-fac-nimic-square.jpg" alt="Ochii pe mine cover art">
          </div>
          <span class="disco-caption">Ochii pe mine</span>
          <span class="disco-meta"><span class="disco-meta-left"><span class="disco-explicit">E</span>Album</span><span class="disco-meta-year">2026</span></span>
        </a>
      </div>
    </div>

    <div id="view-flat" class="disco-view" hidden>
      <div class="disco-grid">
        <a class="disco-card" href="../ochii-pe-mine/">
          <div class="disco-art">
            <img src="../../covers/card/nu-fac-nimic-square.jpg" alt="Ochii pe mine cover art">
          </div>

          <span class="disco-meta"><span class="disco-meta-left"><span class="disco-explicit">E</span>Album</span><span class="disco-meta-year">2026</span></span>

      <p>© 2026 ANDY<br>ALL RIGHTS RESERVED</p>
    </footer>

  </div>
</div>

<script>
(function(){
  var views = {
    type: document.getElementById('view-type'),
    year: document.getElementById('view-year'),
    genre: document.getElementById('view-genre'),
    flat: document.getElementById('view-flat')
  };
  var order = ['type', 'year', 'genre', 'flat'];
  var meta = {
    type: { heading: 'Album', pill: 'By Type' },
    year: { heading: '2026', pill: 'By Year' },
    genre: { heading: 'Rap', pill: 'By Genre' },
    flat: { heading: '', pill: 'All' }
  };
  var current = 0;
  var headingEl = document.getElementById('view-first-heading');
  var pillEl = document.getElementById('view-pill');

  pillEl.addEventListener('click', function(){
    current = (current + 1) % order.length;
    var target = order[current];
    Object.keys(views).forEach(function(key){ views[key].hidden = key !== target; });
    headingEl.textContent = meta[target].heading;
    pillEl.textContent = meta[target].pill;
  });
})();
</script>

<script>
(function(){
  var el = document.querySelector('.sky-bg');
  if(!el) return;
  var forced = document.body.getAttribute('data-text');
  if(forced){
    document.body.classList.toggle('light-cover', forced === 'dark');
    document.body.classList.toggle('dark-cover', forced === 'light');
    return;
  }
  var cs = getComputedStyle(el);
  var m = cs.backgroundImage.match(/url\(["']?(.*?)["']?\)/);
  if(!m) return;
  var fm = cs.filter.match(/brightness\(([\d.]+)\)/);
  var k = fm ? parseFloat(fm[1]) : 1;
  var img = new Image();
  img.onload = function(){
    var w = 24, h = 24;
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    try{
      var data = ctx.getImageData(0, 0, w, h).data;
      var sum = 0, count = 0;
      for(var i=0; i<data.length; i+=4){
        sum += 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
        count++;
      }
      var bright = (sum/count) * k > 135;
      document.body.classList.toggle('light-cover', bright);
      document.body.classList.toggle('dark-cover', !bright);
    }catch(e){}
  };
  img.src = m[1];
})();
</script>
