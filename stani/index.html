<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#17120e;
    --ink-dim:rgba(23,18,14,0.62);
    --sky-fallback:#b7b7b7;
    --surface-2:#2c221a;
    --paper:#f3e9da;
    --paper-dim:#c7b6a1;
    --copper:#e08a45;
    --ember:#c34f3c;
    --line:rgba(243,233,218,0.14);
    --glass:rgba(14,11,8,0.62);
    --glass-hover:rgba(14,11,8,0.74);
    --glass-border:rgba(243,233,218,0.2);
    --bg-image:url(../covers/generic-avatar.jpg);
    --bg-color:var(--sky-fallback);
  }

  html{
    overscroll-behavior:none;
  }
  *{box-sizing:border-box;}
  img{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  body{
    background:var(--sky-fallback);
    color:var(--ink);
    font-family:'Archivo',-apple-system,'Helvetica Neue',Arial,sans-serif;
    margin:0;
    padding:0;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
  }

  .sky-bg{
    position:fixed;
    inset:-30px;
    z-index:-1;
    background-image:var(--bg-image);
    background-color:var(--bg-color);
    background-size:cover;
    background-position:center;
    filter:blur(45px) brightness(0.75);
  }

  .stage{
    position:relative;
    min-height:100vh;
    max-width:480px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 20px 48px;
    overflow-x:hidden;
  }
  @media (min-width:700px){
    .stage{ zoom:1.25; }
  }

  .hero-wrap{
    width:100%;
    max-width:1400px;
    margin:0 auto;
  }
  .hero-photo{
    position:relative;
    z-index:1;
    width:100%;
    height:0;
    padding-top:clamp(44.44%, calc(100% - 55.56% * (100vw - 480px) / 920px), 100%);
    margin-bottom:0;
    overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom, black 78%, transparent 100%);
    mask-image:linear-gradient(to bottom, black 78%, transparent 100%);
  }
  @media (min-width:700px){
    .hero-photo{
      -webkit-mask-image:linear-gradient(to bottom, black 78%, transparent 100%), linear-gradient(to right, transparent 0, black 120px), linear-gradient(to left, transparent 0, black 120px);
      -webkit-mask-composite:source-in, source-in;
      mask-image:linear-gradient(to bottom, black 78%, transparent 100%), linear-gradient(to right, transparent 0, black 120px), linear-gradient(to left, transparent 0, black 120px);
      mask-composite:intersect;
    }
  }
  .hero-photo img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:900;
    font-size:clamp(52px, 15vw, 72px);
    line-height:1;
    letter-spacing:-0.01em;
    margin:0 0 36px;
    text-wrap:balance;
    text-align:center;
  }

  /* ---- section groups ---- */
  .group{
    width:100%;
    margin-bottom:32px;
  }
  .section-label{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  .section-label span{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  /* ---- liquid glass surface, shared by every card/button ---- */
  .spotlight-featured,
  .link-row{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:0 1px 1px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  /* ---- spotlight: only known release ---- */
  .spotlight-featured{
    display:block;
    width:100%;
    padding:12px;
    border-radius:18px;
    text-decoration:none;
    color:var(--paper);
    transition:background .18s ease;
    margin-bottom:16px;
  }
  .spotlight-featured:active,
  .spotlight-featured:focus-visible{
    background:var(--glass-hover);
  }
  .spotlight-featured-art{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:12px;
    background:var(--tint, linear-gradient(150deg, var(--surface-2), var(--ink)));
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .spotlight-featured-art img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .spotlight-title-row{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    margin-top:14px;
  }
  .spotlight-featured-caption{
    display:block;
    margin:0;
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:19px;
    line-height:1.3;
  }
  .release-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:3px 2px 0;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--paper-dim);
    white-space:nowrap;
  }
  .meta-left{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .explicit-tag{
    display:flex;
    align-items:center;
    justify-content:center;
    width:14px;
    height:14px;
    flex:none;
    border:1px solid var(--paper-dim);
    border-radius:3px;
    font-size:9px;
    letter-spacing:0;
  }

  /* ---- links (streaming) ---- */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .link-row{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:14px;
    color:var(--paper);
    text-decoration:none;
    font-family:'Archivo',sans-serif;
    font-weight:600;
    font-size:16px;
    transition:background .18s ease;
  }
  .link-row:active, .link-row:focus-visible{
    background:var(--glass-hover);
  }
  .link-row:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .link-row.is-unavailable{
    opacity:0.45;
    cursor:default;
  }
  .link-unavailable{
    flex:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
    color:var(--paper-dim);
    white-space:nowrap;
  }

  .link-icon{
    width:38px;
    height:38px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    overflow:hidden;
  }
  .link-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .link-label{ flex:1; }

  .link-arrow{
    flex:none;
    color:var(--paper-dim);
  }

  footer{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    color:var(--ink-dim);
  }
  footer p{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.08em;
    line-height:1.7;
    text-align:center;
    margin:0;
  }

  @media (max-width:380px){
    .link-row{ padding:14px 14px; font-size:15px; }
  }

  @media (hover: hover) and (pointer: fine){
    .spotlight-featured:hover,
    .link-row:hover{
      background:var(--glass-hover);
    }
  }

  /* ---- adaptive text colour: dark backgrounds get light text ---- */
  body.dark-cover h1,
  body.dark-cover .view-toolbar-label,
  body.dark-cover .disco-heading,
  body.dark-cover .section-label span,
  body.dark-cover footer{ color:var(--paper); }
  body.dark-cover .tagline{ color:var(--paper-dim); }
  body.dark-cover .back-link{ color:var(--paper); border-bottom-color:var(--paper-dim); }

  .spotlight-featured:last-child,
  .spotlight-grid:last-child{ margin-bottom:0; }
</style>
</head>
<body class="light-cover" oncontextmenu="return false" data-artist="stani">

<div class="sky-bg"></div>

<div class="hero-wrap">
  <div class="hero-photo">
    <img src="../covers/generic-avatar.jpg" alt="Stani" fetchpriority="high" decoding="async">
  </div>
</div>

<div class="stage">
  <div class="page">

    <h1>Stani</h1>

    <section class="group">
      <div class="section-label"><span>Spotlight</span></div>

      <a class="spotlight-featured" href="de-ce-ma-misc-in-zigzag/">
        <div class="spotlight-featured-art">
          <img src="../covers/card/nu-fac-nimic-square.jpg" alt="De ce ma misc in ZigZag cover art">
        </div>
        <div class="spotlight-title-row">
          <span class="spotlight-featured-caption">De ce ma misc in ZigZag</span>
        </div>
        <span class="release-meta"><span class="meta-left"><span class="explicit-tag">E</span>Feature</span><span class="meta-year">2026</span></span>
      </a>
    </section>


    <section class="group">
      <div class="section-label"><span>Streaming</span></div>
      <div class="links">
        <div class="link-row is-unavailable">
          <span class="link-icon" aria-hidden="true">
            <img src="../covers/icons/spotify.webp" alt="">
          </span>
          <span class="link-label">Spotify</span>
          <span class="link-unavailable">(not available)</span>
        </div>

        <div class="link-row is-unavailable">
          <span class="link-icon" aria-hidden="true">
            <img src="../covers/icons/apple-music.webp" alt="">
          </span>
          <span class="link-label">Apple Music</span>
          <span class="link-unavailable">(not available)</span>
        </div>

        <div class="link-row is-unavailable">
          <span class="link-icon" aria-hidden="true">
            <img src="../covers/icons/youtube-music.webp" alt="">
          </span>
          <span class="link-label">YouTube Music</span>
          <span class="link-unavailable">(not available)</span>
        </div>

        <div class="link-row is-unavailable">
          <span class="link-icon" aria-hidden="true">
            <img src="../covers/icons/youtube.webp" alt="">
          </span>
          <span class="link-label">YouTube</span>
          <span class="link-unavailable">(not available)</span>
        </div>
      </div>
    </section>

    <footer>
      <p>© 2026 STANI<br>ALL RIGHTS RESERVED</p>
    </footer>

  </div>
</div>

<script>
(function(){
  var el = document.querySelector('.sky-bg');
  if(!el) return;
  var cs = getComputedStyle(el);
  var m = cs.backgroundImage.match(/url\(["']?(.*?)["']?\)/);
  if(!m) return;
  var fm = cs.filter.match(/brightness\(([\d.]+)\)/);
  var k = fm ? parseFloat(fm[1]) : 1;
  var img = new Image();
  img.onload = function(){
    var w = 24, h = 24;
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    try{
      var data = ctx.getImageData(0, 0, w, h).data;
      var sum = 0, count = 0;
      for(var i=0; i<data.length; i+=4){
        sum += 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
        count++;
      }
      var bright = (sum/count) * k > 135;
      document.body.classList.toggle('light-cover', bright);
      document.body.classList.toggle('dark-cover', !bright);
    }catch(e){}
  };
  img.src = m[1];
})();
</script>
</body>
</html>
